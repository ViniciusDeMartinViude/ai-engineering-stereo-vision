# Supported PySide6 client on Windows: Python 3.12 / conda-forge only.
# Create with: conda env create -f environment-qt312.yml
# Do not use this file to modify the known-good gst-stereo environment.
name: gst-stereo-qt312
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - numpy
  - pillow
  - opencv
  - pyside6
  - pyqtgraph
  - pygobject
  - gst-python
  - pycairo
  - gstreamer
  - gst-plugins-base
  - gst-plugins-good
  - gst-plugins-bad
  - gst-libav
# Optional YOLO after basic video/Qt works:
#   python -m pip install ultralytics
